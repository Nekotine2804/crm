version: "3.8"

# Hạ tầng local cho dev/demo. KHÔNG dùng cho production.
# Database-per-service: mỗi service có 1 Postgres schema/DB riêng, không share DB.

services:
  # ---------- Message broker (giao tiếp bất đồng bộ giữa các service) ----------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI: http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # ---------- Database per service ----------
  postgres-customer:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hoa_mai_customer
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: change-me
    ports: ["5441:5432"]

  postgres-loyalty:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hoa_mai_loyalty
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: change-me
    ports: ["5442:5432"]

  postgres-transaction:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hoa_mai_transaction
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: change-me
    ports: ["5443:5432"]

  postgres-promotion:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hoa_mai_promotion
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: change-me
    ports: ["5444:5432"]

  postgres-notification:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hoa_mai_notification
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: change-me
    ports: ["5445:5432"]
