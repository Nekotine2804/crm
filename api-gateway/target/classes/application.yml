server:
  port: 8000

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: customer-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/customers/**

        - id: loyalty-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/customers/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/v1/customers/$\{segment}

        - id: transaction-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/pos/**

        - id: promotion-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/promotions/**

        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
