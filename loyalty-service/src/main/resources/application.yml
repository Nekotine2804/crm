server:
  port: 8082

spring:
  application:
    name: loyalty-service

  datasource:
    url: jdbc:postgresql://localhost:5432/hoa_mai_loyalty
    username: crm_user
    password: change-me

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: health,info